<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cafeteria Design</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 10px;
      background: #ffffff;
    }

    img {
      display: block;

      /* تصغير الصور بشكل واضح */
      width: 35%;
      max-width: 600px;

      height: auto;

      /* توسيط الصور */
      margin: 25px auto;
    }

    iframe {
      display: block;
      width: 70%;
      max-width: 1100px;
      height: 80vh;
      margin: 25px auto;
      border: none;
    }

    /* للموبايل */
    @media (max-width: 700px) {
      img {
        width: 90%;
      }

      iframe {
        width: 95%;
      }
    }
  </style>
</head>

<body>

  <img src="image.png">

  <img src="R1.png">

  <img src="R3.png">

  <img src="WhatsApp%20Image%202026-08-23%20at%202.12.02%20PM.jpeg">

  <iframe src="Floor%20layout-%20Cafeteria.pdf"></iframe>

</body>
</html>
