<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cafeteria Design</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 10px;
      background: white;
    }

    img {
      display: block;
      width: 35%;
      max-width: 600px;
      height: auto;
      margin: 25px auto;
    }

    iframe {
      display: block;
      width: 70%;
      max-width: 1100px;
      height: 80vh;
      margin: 25px auto;
      border: none;
    }

    @media (max-width: 700px) {
      img {
        width: 90%;
      }

      iframe {
        width: 95%;
      }
    }
  </style>
</head>
